    Ricardo Castro
  </text>

  <!-- =====================================================
       CURSOR
  ====================================================== -->

  <!--
    Nombre:
    x inicial = 42
    ancho forzado = 410
    final = 452

    Cursor = 462
  -->

  <rect
    x="462"
    y="68"
    width="5"
    height="59"
    rx="2"
    fill="#00E5FF"
    filter="url(#smallGlow)"
