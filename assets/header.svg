<svg
  width="1200"
  height="430"
  viewBox="0 0 1200 430"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- Fondo -->
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1200"
      y2="430"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#02070D"/>
      <stop offset="0.5" stop-color="#04111D"/>
      <stop offset="1" stop-color="#020812"/>
    </linearGradient>

    <!-- Brillo cyan -->
    <filter
      id="cyanGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Brillo pequeño -->
    <filter
      id="smallGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cuadrícula -->
    <pattern
      id="grid"
      width="35"
      height="35"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 35 0 L 0 0 0 35"
        fill="none"
        stroke="#0C3750"
        stroke-width="0.7"
        opacity="0.22"
      />
    </pattern>

    <!-- Gradiente del icono -->
    <linearGradient
      id="iconGradient"
      x1="790"
      y1="120"
      x2="1080"
      y2="340"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#9AFFFF"/>
      <stop offset="0.45" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#008CFF"/>
    </linearGradient>

  </defs>

