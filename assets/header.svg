<svg
  width="1200"
  height="430"
  viewBox="0 0 1200 430"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Fondo y cuadrícula -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#03101C"/>
      <stop offset="50%" stop-color="#041525"/>
      <stop offset="100%" stop-color="#07111B"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path
        d="M 34 0 L 0 0 0 34"
        fill="none"
        stroke="#0D3146"
        stroke-width="0.8"
        opacity="0.35"
      />
    </pattern>

    <!-- Brillos -->
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="430" rx="24" fill="url(#bgGradient)"/>
  <rect width="1200" height="430" rx="24" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="427" rx="22.5" stroke="#09D7FF" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Línea superior -->
  <text
    x="38"
    y="38"
    fill="#00E5FF"
    font-family="Consolas, 'Courier New', monospace"
    font-size="17"
    font-weight="700"
    filter="url(#softGlow)"
  >
    &gt;_
  </text>

  <text
    x="84"
    y="38"
    fill="#00E5FF"
    font-family="Consolas, 'Courier New', monospace"
    font-size="17"
    font-weight="700"
  >
    Ricard01117
  </text>

  <text
    x="205"
    y="38"
    fill="#A8C4D6"
    font-family="Consolas, 'Courier New', monospace"
    font-size="17"
  >
    // README.md
  </text>

  <line x1="36" y1="55" x2="680" y2="55" stroke="#1ECFFF" stroke-opacity="0.28"/>

  <!-- Nombre -->
  <text
    x="42"
    y="120"
    fill="#FFFFFF"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="78"
    font-weight="800"
    filter="url(#textGlow)"
  >
    Ricardo Castro
  </text>

  <!-- Cursor a un lado del nombre -->
  <rect
    x="470"
    y="72"
    width="6"
    height="58"
    rx="3"
    fill="#00E5FF"
    filter="url(#softGlow)"
  />

  <!-- Frase principal -->
  <text
    x="42"
    y="165"
    fill="#FFFFFF"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="29"
    font-weight="500"
  >
    Construyendo soluciones reales con código que
  </text>

  <!-- transformA separado para que no se encime -->
  <text
    x="560"
    y="165"
    fill="#00F0E6"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="29"
    font-weight="700"
    filter="url(#softGlow)"
  >
    transforma.
  </text>

  <line x1="42" y1="184" x2="640" y2="184" stroke="#11D8FF" stroke-opacity="0.28"/>

  <!-- Subtítulo -->
  <text
    x="42"
    y="212"
    fill="#00E5FF"
    font-family="Consolas, 'Courier New', monospace"
    font-size="21"
    font-weight="700"
  >
    &lt;/&gt;
  </text>

  <text
    x="85"
    y="212"
    fill="#A9D8F0"
    font-family="Consolas, 'Courier New', monospace"
    font-size="20"
  >
    Desarrollador Frontend &amp; Full Stack
  </text>

  <!-- Caja de código -->
  <rect
    x="40"
    y="238"
    width="630"
    height="112"
    rx="14"
    fill="#07131E"
    fill-opacity="0.85"
    stroke="#11D8FF"
    stroke-opacity="0.45"
    stroke-width="1.3"
  />

  <text x="60" y="276" fill="#4B78B6" font-family="Consolas, monospace" font-size="18">1</text>
  <text x="60" y="300" fill="#4B78B6" font-family="Consolas, monospace" font-size="18">2</text>
  <text x="60" y="324" fill="#4B78B6" font-family="Consolas, monospace" font-size="18">3</text>
  <text x="60" y="348" fill="#4B78B6" font-family="Consolas, monospace" font-size="18">4</text>

  <text x="92" y="276" fill="#00F0E6" font-family="Consolas, monospace" font-size="18" font-weight="700">const</text>
  <text x="145" y="276" fill="#FFFFFF" font-family="Consolas, monospace" font-size="18">developer = {</text>

  <text x="92" y="300" fill="#C95DFF" font-family="Consolas, monospace" font-size="18" font-weight="700">focus:</text>
  <text x="168" y="300" fill="#E8F3FF" font-family="Consolas, monospace" font-size="18">['React', 'JavaScript', 'Python', 'SQL', 'Laravel'],</text>

  <text x="92" y="324" fill="#C95DFF" font-family="Consolas, monospace" font-size="18" font-weight="700">goal:</text>
  <text x="156" y="324" fill="#4BF28C" font-family="Consolas, monospace" font-size="18">'Resolver problemas, crear valor y automatizar procesos.'</text>

  <text x="92" y="348" fill="#E8F3FF" font-family="Consolas, monospace" font-size="18">};</text>

  <!-- Chips tecnologías -->
  <g>
    <rect x="40" y="370" width="108" height="38" rx="10" fill="#07131E" stroke="#00DFFF" stroke-width="1.3"/>
    <text x="94" y="394" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">React</text>
  </g>

  <g>
    <rect x="160" y="370" width="146" height="38" rx="10" fill="#07131E" stroke="#E6C229" stroke-width="1.3"/>
    <text x="233" y="394" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">JavaScript</text>
  </g>

  <g>
    <rect x="318" y="370" width="110" height="38" rx="10" fill="#07131E" stroke="#4AA3FF" stroke-width="1.3"/>
    <text x="373" y="394" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Python</text>
  </g>

  <g>
    <rect x="440" y="370" width="94" height="38" rx="10" fill="#07131E" stroke="#00DFFF" stroke-width="1.3"/>
    <text x="487" y="394" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">SQL</text>
  </g>

  <g>
    <rect x="546" y="370" width="118" height="38" rx="10" fill="#07131E" stroke="#FF4D4D" stroke-width="1.3"/>
    <text x="605" y="394" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Laravel</text>
  </g>

  <!-- Decoración derecha -->
  <g opacity="0.95">
    <circle cx="940" cy="195" r="108" stroke="#0B6EA0" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="940" cy="195" r="90" stroke="#11D8FF" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="8 7"/>
    <circle cx="940" cy="195" r="72" stroke="#11D8FF" stroke-opacity="0.12" stroke-width="1"/>

    <line x1="745" y1="126" x2="830" y2="126" stroke="#11D8FF" stroke-opacity="0.5"/>
    <line x1="745" y1="310" x2="820" y2="310" stroke="#11D8FF" stroke-opacity="0.5"/>
    <line x1="1058" y1="120" x2="1162" y2="120" stroke="#11D8FF" stroke-opacity="0.5"/>
    <line x1="1060" y1="335" x2="1165" y2="335" stroke="#11D8FF" stroke-opacity="0.5"/>

    <circle cx="748" cy="126" r="3.2" fill="#3EE7FF" filter="url(#softGlow)"/>
    <circle cx="742" cy="310" r="3.2" fill="#3EE7FF" filter="url(#softGlow)"/>
    <circle cx="1168" cy="120" r="3.2" fill="#3EE7FF" filter="url(#softGlow)"/>
    <circle cx="1172" cy="335" r="3.2" fill="#3EE7FF" filter="url(#softGlow)"/>

    <!-- símbolo código -->
    <text
      x="940"
      y="248"
      text-anchor="middle"
      fill="#3EE7FF"
      font-family="Consolas, 'Courier New', monospace"
      font-size="120"
      font-weight="700"
      filter="url(#cyanGlow)"
    >
      &lt;/&gt;
    </text>
  </g>

  <!-- Texto inferior derecho -->
  <text
    x="890"
    y="372"
    fill="#FFFFFF"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="18"
    font-weight="700"
  >
    Desarrollo
  </text>

  <circle cx="973" cy="366" r="3.2" fill="#11D8FF"/>

  <text
    x="986"
    y="372"
    fill="#FFFFFF"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="18"
    font-weight="700"
  >
    Automatización
  </text>
</svg>