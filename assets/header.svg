<svg
  width="1200"
  height="430"
  viewBox="0 0 1200 430"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- =========================
         FONDO
    ========================== -->

    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1200"
      y2="430"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#020912"/>
      <stop offset="0.55" stop-color="#03121E"/>
      <stop offset="1" stop-color="#020812"/>
    </linearGradient>

    <pattern
      id="grid"
      width="36"
      height="36"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 36 0 L 0 0 0 36"
        fill="none"
        stroke="#0B3850"
        stroke-width="0.7"
        opacity="0.22"
      />
    </pattern>

    <!-- =========================
         BRILLOS
    ========================== -->

    <filter
      id="cyanGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter
      id="smallGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="2.3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- =====================================================
       FONDO GENERAL
  ====================================================== -->

  <rect
    width="1200"
    height="430"
    rx="24"
    fill="url(#background)"
  />

  <rect
    width="1200"
    height="430"
    rx="24"
    fill="url(#grid)"
  />

  <rect
    x="2"
    y="2"
    width="1196"
    height="426"
    rx="22"
    stroke="#00DFFF"
    stroke-width="1.5"
    stroke-opacity="0.42"
  />

  <!-- =====================================================
       CABECERA TERMINAL
  ====================================================== -->

