<svg
  width="1200"
  height="430"
  viewBox="0 0 1200 430"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Fondo degradado -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030B14"/>
      <stop offset="50%" stop-color="#04111D"/>
      <stop offset="100%" stop-color="#071829"/>
    </linearGradient>

    <!-- Degradado del círculo interior -->
    <radialGradient id="photoBg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(235 205) rotate(90) scale(110 110)">
      <stop offset="0%" stop-color="#123149"/>
      <stop offset="100%" stop-color="#07131E"/>
    </radialGradient>

    <!-- Brillo fuerte -->
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Brillo pequeño -->
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cuadrícula -->
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path
        d="M 38 0 L 0 0 0 38"
        fill="none"
        stroke="#0C3750"
        stroke-width="0.7"
        opacity="0.25"
      />
    </pattern>

    <!-- Recorte para futura foto -->
    <clipPath id="profileClip">
      <circle cx="235" cy="205" r="96"/>
    </clipPath>
  </defs>

  <!-- Fondo principal -->
  <rect x="10" y="10" width="1180" height="410" rx="24" fill="url(#bgGradient)" stroke="#0CCEF2" stroke-opacity="0.35"/>
  <rect x="10" y="10" width="1180" height="410" rx="24" fill="url(#grid)"/>

  <!-- Barra superior -->
  <line x1="10" y1="58" x2="1190" y2="58" stroke="#0CCEF2" stroke-opacity="0.18"/>
  <text
    x="44"
    y="39"
    fill="#00E5FF"
    font-family="Consolas, monospace"
    font-size="19"
    font-weight="700"
  >&gt;_</text>

  <text
    x="84"
    y="39"
    fill="#00E5FF"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="17"
    font-weight="700"
  >Ricard01117</text>

  <text
    x="205"
    y="39"
    fill="#D5E7F2"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="17"
  >/ README.md</text>

  <!-- Divisor vertical -->
  <line x1="395" y1="92" x2="395" y2="382" stroke="#0CCEF2" stroke-opacity="0.16"/>

  <!-- Órbitas -->
  <ellipse
    cx="235"
    cy="205"
    rx="136"
    ry="42"
    transform="rotate(-28 235 205)"
    stroke="#00DFFF"
    stroke-width="1.4"
    stroke-opacity="0.65"
  />
  <ellipse
    cx="235"
    cy="205"
    rx="136"
    ry="42"
    transform="rotate(28 235 205)"
    stroke="#00DFFF"
    stroke-width="1.4"
    stroke-opacity="0.45"
  />

  <!-- Círculo exterior -->
  <circle
    cx="235"
    cy="205"
    r="112"
    stroke="#00E5FF"
    stroke-width="5"
    filter="url(#cyanGlow)"
  />

  <!-- Aro interior -->
  <circle
    cx="235"
    cy="205"
    r="101"
    stroke="#A7F8FF"
    stroke-width="10"
    opacity="0.95"
  />

  <!-- Área de futura foto -->
  <g clip-path="url(#profileClip)">
    <circle cx="235" cy="205" r="96" fill="url(#photoBg)"/>
    <rect x="139" y="109" width="192" height="192" fill="url(#photoBg)"/>
  </g>

  <!-- Texto temporal de foto -->
  <text
    x="235"
    y="198"
    text-anchor="middle"
    fill="#00E5FF"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="22"
    font-weight="700"
  >
    FOTO
  </text>

  <text
    x="235"
    y="226"
    text-anchor="middle"
    fill="#67A9C4"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="14"
  >
    próximamente
  </text>

  <!-- Nombre -->
  <text
    x="235"
    y="370"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="36"
    font-weight="700"
    filter="url(#smallGlow)"
  >
    Ricardo Castro
  </text>

  <!-- Usuario -->
  <text
    x="235"
    y="404"
    text-anchor="middle"
    fill="#00E5FF"
    font-family="Consolas, monospace"
    font-size="20"
    font-weight="600"
  >
    &lt;/&gt; Ricard01117
  </text>

  <!-- Título principal -->
  <text
    x="435"
    y="105"
    fill="#FFFFFF"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="39"
    font-weight="700"
  >
    Construyendo soluciones reales
  </text>

  <text
    x="435"
    y="153"
    fill="#FFFFFF"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="39"
    font-weight="700"
  >
    con código que
  </text>

  <text
    x="705"
    y="153"
    fill="#00F0E6"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="39"
    font-weight="700"
    filter="url(#smallGlow)"
  >
    transforma.
  </text>

  <!-- Línea decorativa -->
  <line
    x1="435"
    y1="180"
    x2="485"
    y2="180"
    stroke="#00F0E6"
    stroke-width="4"
    stroke-linecap="round"
    filter="url(#smallGlow)"
  />

  <!-- Código -->
  <text
    x="435"
    y="220"
    fill="#67A9C4"
    font-family="Consolas, monospace"
    font-size="17"
  >
    const developer = {
  </text>

  <text
    x="460"
    y="250"
    fill="#45E78D"
    font-family="Consolas, monospace"
    font-size="17"
  >
    focus:
  </text>

  <text
    x="525"
    y="250"
    fill="#F6C453"
    font-family="Consolas, monospace"
    font-size="17"
  >
    ['React', 'JavaScript', 'Python', 'SQL', 'Laravel'],
  </text>

  <text
    x="460"
    y="280"
    fill="#45E78D"
    font-family="Consolas, monospace"
    font-size="17"
  >
    goal:
  </text>

  <text
    x="515"
    y="280"
    fill="#F6C453"
    font-family="Consolas, monospace"
    font-size="17"
  >
    'Resolver problemas y automatizar procesos.'
  </text>

  <text
    x="435"
    y="310"
    fill="#67A9C4"
    font-family="Consolas, monospace"
    font-size="17"
  >
    };
  </text>

  <!-- Icono derecho -->
  <text
    x="1038"
    y="245"
    text-anchor="middle"
    fill="#00DFFF"
    font-family="Consolas, monospace"
    font-size="92"
    font-weight="700"
    filter="url(#cyanGlow)"
  >
    &lt;/&gt;
  </text>

  <text
    x="1038"
    y="292"
    text-anchor="middle"
    fill="#5DA4C2"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="17"
  >
    Desarrollo • Automatización
  </text>
</svg>